[package]
name = "vlat"
version = "0.1.18"
edition = "2021"
authors = ["Jason D. Rivard <code@jrivard.org>"]
license = "GPL-3.0-only"
description = "A modern terminal latency monitor with multiple probe protocols and TUI visualization"
repository = "https://github.com/jrivard/vlat"
keywords = ["ping", "latency", "network", "monitoring", "tui"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.88"
# Ship only what the crate needs; screenshots and local test files stay in git.
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "vlat"
path = "src/lib.rs"

[[bin]]
name = "vlat"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# Real probing, DNS resolution, session persistence, and the crossterm/tokio
# TUI event loop - everything the native `vlat` binary needs.
native = [
    "dep:tokio", "dep:hickory-resolver", "dep:surge-ping", "dep:socket2",
    "dep:tokio-rustls", "dep:rustls", "dep:quinn", "dep:rustls-native-certs",
    "dep:rustls-pemfile", "dep:clap_complete", "dep:rand",
    "dep:libc", "dep:windows-sys", "dep:etcetera", "dep:csv", "dep:base64",
    "ratatui/crossterm", "dep:crossterm",
]

[dependencies]
# Core async and networking (native only)
tokio = { version = "1.53", features = ["full"], optional = true }
hickory-resolver = { version = "0.26", default-features = false, optional = true, features = [
    "tokio",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "rustls-platform-verifier",
] }
surge-ping = { version = "0.9", optional = true }
socket2 = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true, features = ["ring"] }
rustls = { version = "0.23", default-features = false, optional = true, features = ["ring", "tls12"] }
quinn = { version = "0.11", default-features = false, optional = true, features = ["rustls-ring", "runtime-tokio"] }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }

# CLI (clap itself is cross-platform and used by both the native binary and
# the shared `cli` module that the web demo also reads Theme/enums from)
clap          = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6", optional = true }
chrono        = { version = "0.4", default-features = false, features = ["std"] }

# TUI — ratatui re-exports crossterm, no need for a separate dep.
# crossterm backend is native-only.
ratatui    = { version = "0.30", default-features = false, features = ["std", "underline-color", "layout-cache"] }
crossterm  = { version = "0.29", features = ["event-stream"], optional = true }
futures    = { version = "0.3", default-features = false, features = ["std"] }
serde      = { version = "1",   features = ["derive"] }
serde_json = "1"
rand       = { version = "0.10", default-features = false, features = ["std", "std_rng"], optional = true }

# Native-only helpers: XDG dir resolution, CSV output, OSC 52 clipboard base64
etcetera = { version = "0.11.0", optional = true }
csv      = { version = "1.4.0", optional = true }
base64   = { version = "0.23.1", optional = true, default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"], optional = true }

